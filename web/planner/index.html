<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>M87 · TO DO</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="app" class="planner-shell" aria-live="polite"></main>
    <dialog id="task-dialog" class="task-dialog">
      <form id="task-form" method="dialog">
        <header><span>TAREFA</span><button type="button" data-close aria-label="Fechar">×</button></header>
        <label>CLIENTE<input id="task-client" autocomplete="off" placeholder="Nome do cliente"></label>
        <label>TRABALHO<textarea id="task-text" rows="4" placeholder="Descrição do trabalho"></textarea></label>
        <label>OBSERVAÇÕES<textarea id="task-notes" rows="3"></textarea></label>
        <div id="task-tags" class="task-tags" aria-label="Categoria"></div>
        <footer><button type="button" id="task-done">CONCLUÍDO</button><span></span><button type="button" data-close>CANCELAR</button><button value="default">OK</button></footer>
      </form>
    </dialog>
    <dialog id="pairing-dialog" class="task-dialog pairing-dialog">
      <form id="pairing-form" method="dialog">
        <header><span>VINCULAR PLANNER</span></header>
        <p>Digite a chave privada criada no Cloudflare. Ela fica salva apenas neste aparelho.</p>
        <label>CHAVE DE PAREAMENTO<input id="pairing-key" type="password" autocomplete="off" required></label>
        <footer><span></span><button value="default">VINCULAR</button></footer>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
